<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Analytics | Growth Projector</title>
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom Configuration for Specific Colors -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0B0F19', // Requested background
                        gold: '#D4AF37',  // Brushed Gold
                        cyan: '#22D3EE',  // Neon Cyan
                        slate: 'rgba(255,255,255,0.05)',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0B0F19; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #D4AF37; }
        
        /* Range Slider Styling */
        input[type=range] {
            -webkit-appearance: none; 
            width: 100%; 
            background: transparent; 
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #D4AF37;
            cursor: pointer;
            margin-top: -10px; 
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.1); }
        
        /* Slider Track */
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #374151;
            border-radius: 2px;
        }

        /* Neon Glow Text */
        .neon-text-cyan {
            text-shadow: 0 0 5px rgba(34, 211, 238, 0.5);
        }
    </style>
    
    <!-- Google Font for Modern Look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body class="bg-dark text-gray-200 font-sans min-h-screen flex flex-col selection:bg-gold selection:text-dark">

    <!-- NAV -->
    <nav class="w-full border-b border-white/10 bg-[#0B0F19]/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-gold rounded-md flex items-center justify-center transform rotate-45 border border-white/20">
                    <span class="-rotate-45 text-dark font-bold text-lg">N</span>
                </div>
                <span class="font-bold tracking-wide text-xl text-white">NEXUS <span class="text-gold">ANALYTICS</span></span>
            </div>
            <div class="flex gap-4 text-sm font-medium text-gray-400">
                <span class="hover:text-gold cursor-pointer transition-colors">Dashboard</span>
                <span class="text-cyan-400 border-b border-cyan-400 pb-1">Projector</span>
                <span class="hover:text-gold cursor-pointer transition-colors">Settings</span>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="flex-grow container mx-auto px-4 py-8 max-w-7xl">
        
        <!-- HEADER: 3-CARD KPI -->
        <header id="kpi-header" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10 animate-fade-in-up">
            
            <!-- KPI Card 1: Total Value -->
            <div class="bg-slate rounded-xl p-6 border border-white/5 relative overflow-hidden group hover:border-gold/30 transition-colors duration-300">
                <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
                    <svg class="w-16 h-16 text-gold" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.99V14zm0 3l-2.5-1.25L12 15.01v-2.26z"/></svg>
                </div>
                <p class="text-sm font-semibold text-gray-400 uppercase tracking-wider">Projected Yield</p>
                <h2 id="kpi-yield" class="text-4xl font-bold text-white mt-2">$0.00</h2>
                <div class="mt-2 inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gold/10 text-gold border border-gold/20">
                    <span>+24.5%</span>
                </div>
            </div>

            <!-- KPI Card 2: Monthly Growth Rate -->
            <div class="bg-slate rounded-xl p-6 border border-white/5 relative overflow-hidden group hover:border-cyan/30 transition-colors duration-300">
                 <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
                    <svg class="w-16 h-16 text-cyan" fill="currentColor" viewBox="0 0 24 24"><path d="M13 7h-2v4H7v2h4v4h2v-4h4v-2h-4V7zm-1 5c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/></svg>
                </div>
                <p class="text-sm font-semibold text-gray-400 uppercase tracking-wider">Avg. Monthly Return</p>
                <h2 id="kpi-monthly" class="text-3xl font-bold text-white mt-2 neon-text-cyan">$0.00</h2>
                <p id="kpi-monthly-label" class="text-xs text-gray-500 mt-1">Estimated Net Income</p>
            </div>

            <!-- KPI Card 3: Efficiency Score -->
            <div class="bg-slate rounded-xl p-6 border border-white/5 relative overflow-hidden group hover:border-gold/30 transition-colors duration-300">
                 <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
                    <svg class="w-16 h-16 text-gray-500" fill="currentColor" viewBox="0 0 24 24"><path d="M22.28 9.72l-12 8.26a2.99 2.99 0 0 1-3.14 0L1.72 9.72L5 4h14l3.28 5.72z"/></svg>
                </div>
                <p class="text-sm font-semibold text-gray-400 uppercase tracking-wider">Efficiency Score</p>
                <h2 id="kpi-score" class="text-3xl font-bold text-white mt-2">0%</h2>
                <div class="mt-4 bg-black/30 rounded-full h-2 w-full overflow-hidden">
                    <div id="score-bar" class="bg-gradient-to-r from-gold to-yellow-600 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
        </header>

        <!-- CALCULATOR MODULE -->
        <section class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- INPUTS CONTROLS (Left 2/3) -->
            <div class="lg:col-span-2 space-y-6">
                
                <!-- Card Wrapper -->
                <div class="bg-[#0E1220] border border-white/10 rounded-2xl p-8 shadow-lg">
                    <div class="flex items-center justify-between mb-8">
                        <h3 class="text-xl font-semibold text-white flex items-center gap-2">
                            <svg class="w-6 h-6 text-cyan" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                            Growth Parameters
                        </h3>
                        <button onclick="resetCalc()" class="text-xs text-gray-500 hover:text-gold transition-colors uppercase font-bold tracking-wider">Reset Data</button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        
                        <!-- INPUT 1: Base Value -->
                        <div class="space-y-3">
                            <label class="text-xs text-gray-400 uppercase font-semibold flex justify-between">
                                <span>Initial Capital</span>
                                <span id="display-base" class="text-gold font-mono">$5,000.00</span>
                            </label>
                            <div class="relative">
                                <input type="range" id="in-base" min="1000" max="100000" step="100" value="5000" 
                                    class="w-full h-2 bg-gray-800 rounded-lg appearance-none cursor-pointer">
                            </div>
                        </div>

                        <!-- INPUT 2: Growth Rate % -->
                        <div class="space-y-3">
                            <label class="text-xs text-gray-400 uppercase font-semibold flex justify-between">
                                <span>Growth Rate</span>
                                <span id="display-rate" class="text-gold font-mono">15%</span>
                            </label>
                            <input type="range" id="in-rate" min="1" max="100" step="1" value="15" 
                                class="w-full h-2 bg-gray-800 rounded-lg appearance-none cursor-pointer">
                        </div>

                        <!-- INPUT 3: Duration -->
                        <div class="space-y-3">
                            <label class="text-xs text-gray-400 uppercase font-semibold flex justify-between">
                                <span>Duration (Months)</span>
                                <span id="display-duration" class="text-gold font-mono">12</span>
                            </label>
                            <input type="range" id="in-duration" min="3" max="60" step="1" value="12" 
                                class="w-full h-2 bg-gray-800 rounded-lg appearance-none cursor-pointer">
                        </div>

                         <!-- INPUT 4: Initial Expense -->
                         <div class="space-y-3">
                            <label class="text-xs text-gray-400 uppercase font-semibold flex justify-between">
                                <span>Initial Expense</span>
                                <span id="display-expense" class="text-red-400 font-mono">$1,200.00</span>
                            </label>
                             <input type="range" id="in-expense" min="100" max="5000" step="50" value="1200" 
                                class="w-full h-2 bg-gray-800 rounded-lg appearance-none cursor-pointer">
                        </div>

                    </div>
                </div>

            </div>

            <!-- RESULTS / VISUALIZATION (Right 1/3) -->
            <div class="lg:col-span-1">
                <div class="bg-gradient-to-br from-[#0E1220] to-[#0B0F19] border border-white/10 rounded-2xl p-6 h-full flex flex-col justify-between shadow-2xl relative overflow-hidden">
                    
                    <!-- Decoration -->
                    <div class="absolute top-0 right-0 w-32 h-32 bg-cyan/10 rounded-full blur-3xl -mr-16 -mt-16"></div>

                    <div>
                        <p class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-2">Net Profit</p>
                        <h2 id="res-profit" class="text-5xl font-bold text-white mb-2">$0</h2>
                        <div class="flex items-center gap-2 text-xs text-gold bg-gold/10 px-3 py-1 rounded-full w-fit">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z"></path></svg>
                            After Expenses
                        </div>
                    </div>

                    <div class="space-y-4 mt-8">
                        <!-- Progress Bars for results breakdown -->
                        <div>
                            <div class="flex justify-between text-xs mb-1 text-gray-400">
                                <span>Growth</span>
                                <span id="bar-growth-val" class="text-cyan font-mono">0%</span>
                            </div>
                            <div class="w-full bg-gray-800 rounded-full h-2 mb-3">
                                <div id="bar-growth" class="bg-cyan h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
                            </div>
                        </div>

                         <div>
                            <div class="flex justify-between text-xs mb-1 text-gray-400">
                                <span>Principal</span>
                                <span id="bar-principal-val" class="text-gold font-mono">0%</span>
                            </div>
                            <div class="w-full bg-gray-800 rounded-full h-2">
                                <div id="bar-principal" class="bg-gold h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
                            </div>
                        </div>

                        <div class="mt-6 pt-4 border-t border-white/10">
                            <p class="text-xs text-gray-500 mb-2">Efficiency Score</p>
                            <div id="score-circle" class="flex justify-center items-center relative w-32 h-32 mx-auto">
                                <!-- Simple SVG Circle for score -->
                                <svg class="w-full h-full transform -rotate-90">
                                    <circle cx="64" cy="64" r="56" stroke="#1f2937" stroke-width="8" fill="none" />
                                    <circle id="score-circle-progress" cx="64" cy="64" r="56" stroke="#22D3EE" stroke-width="8" fill="none" stroke-dasharray="351.86" stroke-dashoffset="351.86" class="transition-all duration-700 ease-out" />
                                </svg>
                                <span id="score-number" class="absolute text-xl font-bold text-white">0%</span>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer class="bg-[#080C15] border-t border-white/5 py-6 mt-auto">
        <div class="container mx-auto px-4 text-center">
            <p class="text-gray-500 text-xs">© 2023 Nexus Analytics. All systems operational.</p>
        </div>
    </footer>

    <!-- LOGIC SCRIPT -->
    <script>
        // DOM Elements
        const inputs = {
            base: document.getElementById('in-base'),
            rate: document.getElementById('in-rate'),
            duration: document.getElementById('in-duration'),
            expense: document.getElementById('in-expense')
        };

        const displays = {
            base: document.getElementById('display-base'),
            rate: document.getElementById('display-rate'),
            duration: document.getElementById('display-duration'),
            expense: document.getElementById('display-expense')
        };

        const kpis = {
            yield: document.getElementById('kpi-yield'),
            monthly: document.getElementById('kpi-monthly'),
            score: document.getElementById('kpi-score'),
            monthlyLabel: document.getElementById('kpi-monthly-label'),
            barGrowth: document.getElementById('bar-growth'),
            barPrincipal: document.getElementById('bar-principal'),
            scoreBar: document.getElementById('score-bar')
        };

        const resultContainer = {
            profit: document.getElementById('res-profit'),
            barGrowthVal: document.getElementById('bar-growth-val'),
            barPrincipalVal: document.getElementById('bar-principal-val'),
            scoreCircle: document.getElementById('score-circle-progress'),
            scoreNumber: document.getElementById('score-number')
        };

        // State object to handle persistence
        let state = {
            base: 5000,
            rate: 15,
            duration: 12,
            expense: 1200
        };

        // Format Currency Helper
        const fmtUSD = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });

        function calculate() {
            // Get raw values
            const base = parseFloat(inputs.base.value);
            const rate = parseFloat(inputs.rate.value) / 100;
            const months = parseInt(inputs.duration.value);
            const expense = parseFloat(inputs.expense.value);

            // Display updates immediately for sliders
            displays.base.textContent = fmtUSD.format(base);
            displays.rate.textContent = inputs.rate.value + '%';
            displays.duration.textContent = inputs.duration.value;
            displays.expense.textContent = fmtUSD.format(expense);

            // Logic: Compound Growth - (Base * (1+Rate)^Months) - Expense
            
            const totalValue = base * Math.pow(1 + rate, months);
            const netProfit = totalValue - expense;
            
            // Monthly Average
            const avgMonthly = netProfit / months;

            // Efficiency Calculation: (Net Profit / Initial Capital) * 100 (Clamped to 0-120 for visual)
            let efficiency = ((netProfit / base) * 100);
            if(efficiency > 150) efficiency = 150; 
            if(efficiency < 0) efficiency = 0;

            // --- UPDATE DOM ---

            // KPI Header
            kpis.yield.textContent = fmtUSD.format(totalValue).replace('.00', '');
            
            kpis.monthly.textContent = fmtUSD.format(avgMonthly);
            kpis.monthlyLabel.textContent = `Avg: ${avgMonthly.toFixed(0)}/mo`;
            
            kpis.score.textContent = Math.round(efficiency) + '%';

            // Visual Bars (Growth vs Principal)
            const principalRatio = base / totalValue;
            const growthRatio = 1 - principalRatio;

            kpis.barPrincipal.style.width = `${principalRatio * 100}%`;
            kpis.barGrowth.style.width = `${growthRatio * 100}%`;

            kpis.barPrincipalVal.textContent = Math.round(principalRatio * 100) + '%';
            kpis.barGrowthVal.textContent = Math.round(growthRatio * 100) + '%';

            // Score Circle & Bar (Visual representation of efficiency)
            resultContainer.scoreCircle.style.strokeDashoffset = 351.86 - (351.86 / 150 * efficiency);
            kpis.scoreBar.style.width = `${(efficiency/150)*100}%`;
            
            // Color coding for profit/loss
            if(netProfit > 0) {
                resultContainer.profit.classList.add('text-gold');
                resultContainer.profit.classList.remove('text-red-400');
            } else {
                resultContainer.profit.textContent = fmtUSD.format(Math.abs(netProfit));
                resultContainer.profit.classList.remove('text-gold');
                resultContainer.profit.classList.add('text-red-400');
            }

            // Save to Local Storage
            saveToLocal();
        }

        function saveToLocal() {
            localStorage.setItem('nexus_calc_state', JSON.stringify(state));
        }

        function loadFromLocal() {
            const saved = localStorage.getItem('nexus_calc_state');
            if (saved) {
                state = JSON.parse(saved);
                inputs.base.value = state.base;
                inputs.rate.value = state.rate;
                inputs.duration.value = state.duration;
                inputs.expense.value = state.expense;
            }
            calculate(); // Render based on loaded data
        }

        function resetCalc() {
            localStorage.removeItem('nexus_calc_state');
            // Reset to defaults in JS object and UI
            state.base = 5000;
            state.rate = 15;
            state.duration = 12;
            state.expense = 1200;

            inputs.base.value = 5000;
            inputs.rate.value = 15;
            inputs.duration.value = 12;
            inputs.expense.value = 1200;
            
            calculate();
        }

        // Event Listeners for all sliders
        Object.values(inputs).forEach(input => {
            input.addEventListener('input', (e) => {
                const id = e.target.id.replace('in-', '');
                state[id] = e.target.value; // Update internal state immediately for logic sync if needed
                
                calculate();
            });
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadFromLocal();
        });

    </script>
</body>
</html>
